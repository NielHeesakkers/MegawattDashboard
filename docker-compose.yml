services:
  organigram:
    build:
      context: https://github.com/NielHeesakkers/megawatt-organigram.git#main
    container_name: megawatt-organigram
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-megawatt-organigram-secret-2026}
    volumes:
      - organigram-data:/app/data
      - organigram-uploads:/app/uploads
    restart: unless-stopped

volumes:
  organigram-data:
  organigram-uploads:
