services:
  dashboard:
    build: .
    container_name: megawatt-dashboard
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET:-megawatt-dashboard-secret-2026}
    volumes:
      - dashboard-data:/app/data
      - dashboard-uploads:/app/uploads
      - dashboard-backups:/app/Backup
    restart: unless-stopped

volumes:
  dashboard-data:
  dashboard-uploads:
  dashboard-backups:
