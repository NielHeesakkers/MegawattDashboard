name: Build & Push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/megawatt-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Redeployt de Portainer-stack via de API en pullt daarbij de nieuwe image.
      # Secrets: PORTAINER_URL (bv. https://docker.megawatt.agency), PORTAINER_API_KEY (access token).
      - name: Redeploy via Portainer API
        if: github.ref == 'refs/heads/main'
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: "2"
          ENDPOINT_ID: "3"
        run: |
          if [ -z "$PORTAINER_URL" ] || [ -z "$PORTAINER_API_KEY" ]; then
            echo "Portainer-secrets ontbreken — redeploy overgeslagen."
            exit 0
          fi
          echo "Huidige stack ophalen…"
          stack=$(curl -fsS -H "X-API-Key: $PORTAINER_API_KEY" "$PORTAINER_URL/api/stacks/$STACK_ID")
          file=$(curl -fsS -H "X-API-Key: $PORTAINER_API_KEY" "$PORTAINER_URL/api/stacks/$STACK_ID/file" | jq -r '.StackFileContent')
          env=$(printf '%s' "$stack" | jq -c '.Env // []')
          echo "Stack opnieuw uitrollen met re-pull…"
          curl -fsS -X PUT \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            -H "Content-Type: application/json" \
            "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -d "$(jq -n --arg f "$file" --argjson e "$env" '{stackFileContent:$f, env:$e, pullImage:true, prune:false}')" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "Redeploy klaar."
