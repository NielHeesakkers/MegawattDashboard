name: Build & Push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/megawatt-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Redeployt de Portainer-stack via de API en pullt daarbij de nieuwe image.
      # Secrets: PORTAINER_URL (bv. https://docker.megawatt.agency), PORTAINER_API_KEY (access token).
      - name: Redeploy via Portainer API
        if: github.ref == 'refs/heads/main'
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: "2"
          ENDPOINT_ID: "3"
        run: |
          if [ -z "$PORTAINER_URL" ] || [ -z "$PORTAINER_API_KEY" ]; then
            echo "Portainer-secrets ontbreken — redeploy overgeslagen."
            exit 0
          fi
          IMAGE="ghcr.io/nielheesakkers/megawatt-dashboard"
          echo "1/3 Nieuwe image pullen op de server (Docker-API via Portainer)…"
          curl -fsS --max-time 600 -X POST -H "X-API-Key: $PORTAINER_API_KEY" \
            "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/images/create?fromImage=$IMAGE&tag=latest" -o /dev/null
          echo "2/3 Stack opnieuw uitrollen…"
          stack=$(curl -fsS -H "X-API-Key: $PORTAINER_API_KEY" "$PORTAINER_URL/api/stacks/$STACK_ID")
          file=$(curl -fsS -H "X-API-Key: $PORTAINER_API_KEY" "$PORTAINER_URL/api/stacks/$STACK_ID/file" | jq -r '.StackFileContent')
          env=$(printf '%s' "$stack" | jq -c '.Env // []')
          curl -fsS -X PUT \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            -H "Content-Type: application/json" \
            "$PORTAINER_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -d "$(jq -n --arg f "$file" --argjson e "$env" '{stackFileContent:$f, env:$e, pullImage:true, prune:false}')" \
            -o /dev/null -w "stack update: HTTP %{http_code}\n"
          echo "3/3 Verifiëren dat de container op de nieuwe image draait…"
          sleep 5
          img_id=$(curl -fsS -H "X-API-Key: $PORTAINER_API_KEY" "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/images/$IMAGE:latest/json" | jq -r '.Id')
          ctr_img=$(curl -fsS -H "X-API-Key: $PORTAINER_API_KEY" "$PORTAINER_URL/api/endpoints/$ENDPOINT_ID/docker/containers/megawatt-dashboard/json" | jq -r '.Image')
          echo "image :latest = $img_id"
          echo "container     = $ctr_img"
          if [ "$img_id" != "$ctr_img" ]; then
            echo "::error::Container draait NIET op de nieuwe image — redeploy mislukt."
            exit 1
          fi
          echo "Redeploy geverifieerd: container draait op de nieuwe image."
