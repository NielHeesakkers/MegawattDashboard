services:
  dashboard:
    image: ghcr.io/nielheesakkers/megawatt-dashboard:latest
    container_name: megawatt-dashboard
    restart: unless-stopped
    ports:
      - "3003:3001"
    volumes:
      - /var/www/vhosts/megawatt.agency/dashboard.megawatt.agency/data:/app/data
      - /var/www/vhosts/megawatt.agency/dashboard.megawatt.agency/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=megawatt-dashboard-secret-2026
